name: Build git-annex on Windows

on:
  push:
  schedule:
    - cron: "46 19 * * *"

defaults:
  run:
    shell: C:/msys64/usr/bin/bash.exe -e {0}

env:
  LANG: C.utf-8

jobs:
  build-package:
    runs-on: windows-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v6
        with:
          submodules: false
      
      - name: Handle long filenames
        run: git config --system core.longpaths true

      - name: Clone git-annex
        run: |
          git clone --depth 1 git://git-annex.branchable.com/ git-annex

      - name: Install pkg-config
        run: |
          echo "PKG_CONFIG_ALLOW_SYSTEM_CFLAGS=1" >> $GITHUB_ENV
          echo "PKG_CONFIG_ALLOW_SYSTEM_LIBS=1"   >> $GITHUB_ENV
          ghcup run -m -- pacman --noconfirm -S mingw-w64-x86_64-pkg-config
          echo "C:/msys64/mingw64/bin" >> "$GITHUB_PATH"

      - name: Install libbotan
        run: |
          ghcup run -m -- pacman --noconfirm -S mingw-w64-x86_64-libbotan

      - name: Setup Haskell
        id: setup-haskell
        uses: haskell-actions/setup@v2.12.1
        with:
          ghc-version: 9.10.3
          cabal-version: 3.16

      - name: cabal configure
        working-directory: ./git-annex
        run: |
          echo "import: https://www.stackage.org/lts-24.52/cabal.config" >> cabal.project
          cabal configure \
            --extra-prog-path=C:/msys64/mingw64/bin \
            --extra-include-dirs=C:/msys64/mingw64/include \
            --extra-lib-dirs=C:/msys64/mingw64/lib \
            -fBotan -f-magicmime

      # generate git-annex/dist-newstyle/cache/plan.json used in caching
      - name: generate cabal plan
        working-directory: ./git-annex
        run: |
          cabal build all --dry-run

      - name: Restore cache
        uses: actions/cache/restore@v6
        id: restore-cabal-cache
        env:
          key: cache-cabal-windows
        with:
          path: ${{ steps.setup-haskell.outputs.cabal-store }}
          key: ${{ env.key }}-${{ hashFiles('git-annex/dist-newstyle/cache/plan.json') }}
          restore-keys: ${{ env.key }}-

      - name: Build cabal dependencies
        working-directory: ./git-annex
        run: |
          cabal build --only-dependencies

      - name: Save cache
        uses: actions/cache/save@v6
        if: ${{ steps.restore-cabal-cache.outputs.cache-hit != 'true' }}
        with:
          path: ${{ steps.setup-haskell.outputs.cabal-store }}
          key: ${{ steps.restore-cabal-cache.outputs.cache-primary-key }}

      - name: Build git-annex
        working-directory: ./git-annex
        run:
          cabal build
          cabal install --installdir=.
          ./git-annex version
          ldd ./git-annex
