name: Build git-annex on Windows

on:
  push:
  schedule:
    - cron: "46 19 * * *"

defaults:
  run:
    shell: C:/msys64/usr/bin/bash.exe -e {0}

env:
  LANG: C.utf-8

jobs:
  build-package:
    runs-on: windows-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Clone haskell-cryptography/botan
        run: |
          git clone https://github.com/haskell-cryptography/botan

      - name: Setup Haskell
        uses: haskell-actions/setup@v2.12.1
        with:
          ghc-version: 9.10.3
          cabal-version: 3.16

      - name: Install pkg-config
        run: |
          echo "PKG_CONFIG_ALLOW_SYSTEM_CFLAGS=1" >> $GITHUB_ENV
          echo "PKG_CONFIG_ALLOW_SYSTEM_LIBS=1"   >> $GITHUB_ENV
          ghcup run -m -- pacman --noconfirm -S mingw-w64-x86_64-pkg-config
          echo "C:/msys64/mingw64/bin" >> "$GITHUB_PATH"

      - name: Setup botan
        uses: ./.github/actions/setup-botan
        with:
          botan-version: 3.13.0

      - name: cabal configure
        working-directory: ./botan
        run: |
          cabal configure \
            --enable-tests \
            --enable-benchmarks \
            --disable-documentation \
            ${{ runner.os == 'Windows' && '--extra-prog-path=C:/msys64/mingw64/bin' }} \
            ${{ runner.os == 'Windows' && '--extra-include-dirs=C:/msys64/mingw64/include' }} \
            ${{ runner.os == 'Windows' && '--extra-lib-dirs=C:/msys64/mingw64/lib' }} \
            --constraint="botan-bindings +pkg-config" \
            --ghc-options="-Werror"
          cat "cabal.project.local"

      - name: cabal build
        working-directory: ./botan
        run: |
          cabal build all
      

      - name: use botan-low in another package
        working-directory: ./botan
        run: |
          mkdir foo
          cd foo
          echo "packages: *.cabal ../botan-low/botan-low.cabal" > cabal.project
          echo "Name: foo" > foo.cabal
          echo "Version: 1" >> foo.cabal
          echo "Cabal-Version: 1.12" >> foo.cabal
          echo "Build-type: Simple" >> foo.cabal
          echo "Executable foo" >> foo.cabal
          echo "  Main-Is: foo.hs" >> foo.cabal
          echo "Build-Depends: botan-low (< 0.3), base" >> foo.cabal
          echo "import qualified Botan.Low.Hash as Botan" >> foo.hs
          echo "main = do" >> foo.hs
          echo "  hasher <- Botan.hashInit Botan.SHA1" >> foo.hs
          echo "  h <- Botan.hashFinal hasher" >> foo.hs
          echo "  print h" >> foo.hs
          cabal configure \
            ${{ runner.os == 'Windows' && '--extra-prog-path=C:/msys64/mingw64/bin' }} \
            ${{ runner.os == 'Windows' && '--extra-include-dirs=C:/msys64/mingw64/include' }} \
            ${{ runner.os == 'Windows' && '--extra-lib-dirs=C:/msys64/mingw64/lib' }}
          cabal build
          cabal run

      #- name: cabal test
      #  working-directory: ./botan
      #  run: |
      #    cabal test all -j1 --test-show-details=direct
