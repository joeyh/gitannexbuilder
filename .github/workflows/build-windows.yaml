name: Build git-annex on Windows

on:
  push:
  schedule:
    - cron: "46 19 * * *"

defaults:
  run:
    shell: C:/msys64/usr/bin/bash.exe -e {0}

env:
  LANG: C.utf-8

jobs:
  build-package:
    runs-on: windows-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v6
        with:
          submodules: false
      
      - name: Handle long filenames
        run: git config --system core.longpaths true

      - name: Clone git-annex
        run: |
          git clone --branch quickbotan --no-checkout --depth 1 git://git-annex.branchable.com/ git-annex

      - name: Checkout git-annex
        # we exclude doc/ -- it has filenames so long that the FS
        # on windows barfs
        working-directory: ./git-annex
        run: |
          git checkout origin/quickbotan

      - name: Setup Haskell
        uses: haskell-actions/setup@v2.12.1
        with:
          ghc-version: 9.10.3
          cabal-version: 3.16

      - name: Install pkg-config
        run: |
          echo "PKG_CONFIG_ALLOW_SYSTEM_CFLAGS=1" >> $GITHUB_ENV
          echo "PKG_CONFIG_ALLOW_SYSTEM_LIBS=1"   >> $GITHUB_ENV
          ghcup run -m -- pacman --noconfirm -S mingw-w64-x86_64-pkg-config
          echo "C:/msys64/mingw64/bin" >> "$GITHUB_PATH"

      - name: Setup botan
        uses: ./.github/actions/setup-botan
        with:
          botan-version: 3.13.0

      - name: dummy package
        run: |
          mkdir foo
          cd foo
          echo "Name: foo" > foo.cabal
          echo "Version: 1" >> foo.cabal
          echo "Cabal-Version: 1.12" >> foo.cabal
          echo "Build-type: Simple" >> foo.cabal
          echo "Executable foo" >> foo.cabal
          echo "  Main-Is: foo.hs" >> foo.cabal
          echo "  Build-Depends: botan-low (< 0.3), base" >> foo.cabal
          echo "import qualified Botan.Low.Hash as Botan" >> foo.hs
          echo "main = do" >> foo.hs
          echo "  hasher <- Botan.hashInit Botan.SHA1" >> foo.hs
          echo "  h <- Botan.hashFinal hasher" >> foo.hs
          echo "  print h" >> foo.hs
          cabal configure \
            --extra-prog-path=C:/msys64/mingw64/bin \
            --extra-include-dirs=C:/msys64/mingw64/include \
            --extra-lib-dirs=C:/msys64/mingw64/lib
          cabal build
          cabal run

      - name: build git-annex
        working-directory: ./git-annex
        run: |
          cabal configure \
            --extra-prog-path=C:/msys64/mingw64/bin \
            --extra-include-dirs=C:/msys64/mingw64/include \
            --extra-lib-dirs=C:/msys64/mingw64/lib
          cabal build
          cabal run
