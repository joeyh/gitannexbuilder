name: Build git-annex on Windows

on:
  push:
  schedule:
    - cron: "46 19 * * *"

defaults:
  run:
    shell: C:/msys64/usr/bin/bash.exe -e {0}

env:
  LANG: C.utf-8

jobs:
  build-package:
    runs-on: windows-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v6
        with:
          submodules: false
      
      - name: Handle long filenames
        run: git config --system core.longpaths true

      - name: Clone git-annex
        run: |
          git clone --depth 1 git://git-annex.branchable.com/ git-annex

      - name: Add msys and mingw64 to path
        run: |
          echo "C:/msys64/mingw64/bin" >> "$GITHUB_PATH"
          echo "C:/mingw64/bin" >> "$GITHUB_PATH"

      - name: Install pkg-config
        run: |
          echo "PKG_CONFIG_ALLOW_SYSTEM_CFLAGS=1" >> $GITHUB_ENV
          echo "PKG_CONFIG_ALLOW_SYSTEM_LIBS=1"   >> $GITHUB_ENV
          ghcup run -m -- pacman --noconfirm -S mingw-w64-x86_64-pkg-config

      - name: Install libbotan
        run: |
          ghcup run -m -- pacman --noconfirm -S mingw-w64-x86_64-libbotan

      - name: Install NSIS
        run: |
          ghcup run -m -- pacman --noconfirm -S mingw-w64-x86_64-nsis

      # Not using mingw-w64-x86_64-file because it looks for magic.mgc
      # in /mingw64/share/misc/magic.mgc. This build looks for it
      # in the same directory as the binary.
      - name: Download and "install" libmagic for windows
        working-directory: ./git-annex
        run: |
          gh release download -R datalad/file-windows -p file-windows-dist.zip
          unzip file-windows-dist.zip
          cp libmagic-1.dll libmagic.dll
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Haskell
        id: setup-haskell
        uses: haskell-actions/setup@v2.12.1
        with:
          ghc-version: 9.10.3
          cabal-version: 3.16

      - name: Set UPGRADE_LOCATION
        run: |
          # This tells git-annex where to upgrade itself from.
          echo "UPGRADE_LOCATION=http://downloads.kitenet.net/git-annex/windows/current/git-annex-installer.exe" >> "$GITHUB_ENV"

      - name: cabal configure
        working-directory: ./git-annex
        run: |
          echo "import: https://www.stackage.org/lts-24.52/cabal.config" >> cabal.project
          cabal configure \
            --extra-prog-path=C:/msys64/mingw64/bin \
            --extra-include-dirs=C:/msys64/mingw64/include \
            --extra-lib-dirs=C:/msys64/mingw64/lib \
            --extra-include-dirs=$PWD \
            --extra-lib-dirs=$PWD \
            -fBotan -fMagicMime

      # generate git-annex/dist-newstyle/cache/plan.json used in caching
      - name: generate cabal plan
        working-directory: ./git-annex
        run: |
          cabal build all --dry-run

      - name: Restore cache
        uses: actions/cache/restore@v6
        id: restore-cabal-cache
        env:
          key: cache-cabal-windows
        with:
          path: ${{ steps.setup-haskell.outputs.cabal-store }}
          key: ${{ env.key }}-${{ hashFiles('git-annex/dist-newstyle/cache/plan.json') }}
          restore-keys: ${{ env.key }}-

      - name: Build cabal dependencies
        working-directory: ./git-annex
        run: |
          cabal build --only-dependencies \
            --extra-prog-path=C:/msys64/mingw64/bin \
            --extra-include-dirs=C:/msys64/mingw64/include \
            --extra-include-dirs=$PWD \
            --extra-lib-dirs=$PWD

      - name: Save cache
        uses: actions/cache/save@v6
        if: ${{ steps.restore-cabal-cache.outputs.cache-hit != 'true' }}
        with:
          path: ${{ steps.setup-haskell.outputs.cabal-store }}
          key: ${{ steps.restore-cabal-cache.outputs.cache-primary-key }}

      - name: Update version info for git rev being built.
        working-directory: ./git-annex
        run: |
          mkdir -p dist
          ghc -no-haddock Build/BuildVersion.hs
          ./Build/BuildVersion > dist/build-version

      - name: Build git-annex
        working-directory: ./git-annex
        run: |
          cabal build --enable-executable-static
          cabal install --installdir=.
          ./git-annex version
          ldd ./git-annex

      - name: Build the installer
        working-directory: ./git-annex
        run: |
          ghc -no-haddock --package nsis -- -Wall -fno-warn-tabs Build/NullSoftInstaller.hs
          TMP="$PWD" ./Build/NullSoftInstaller

      - name: Install git-annex using the installer
        working-directory: ./git-annex
        shell: powershell
        run: |
          ./git-annex-installer.exe /S

      - name: Check that magic files are installed
        run: |
          GIT_ANNEX_PATH="$(type -p git-annex)"
          echo "git-annex is at $GIT_ANNEX_PATH"
          GIT_ANNEX_DIR="$(dirname "$GIT_ANNEX_PATH")"
          ls "$GIT_ANNEX_DIR"/*magic* "$GIT_ANNEX_DIR"/*gnurx*
          ls "$GIT_ANNEX_DIR"/../share/misc/*magic*

      - name: Print git-annex version
        run: |
          git annex version

      - name: Check git-annex version for some expected build flags
        run: |
          flags=$(git annex version | grep 'build flags:')
          for f in Assistant MagicMime Servant S3; do
            echo -n "Checking for $f: "
            echo "$flags" | grep --color "$f" || { echo "FAIL"; exit 1; }
          done

      - name: Run tests
        run: |
          git config --global user.email "test@example.com"
          git config --global user.name "Test User"

          timeout 3600 git annex test

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: git-annex-windows-installer
          path: |
            git-annex/git-annex-installer.exe
            git-annex/dist/build-version
          overwrite: true
